spring.application.name=qr-transaction

# Active Profile (defaults to 'local' when running locally)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server Port
server.port=${PORT:8082}

# Connection with PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Qr_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ABA PayWay Configuration
# SECURITY WARNING: Never hardcode production API keys here!
# In production, pass them securely using environment variables or application-local.properties
aba.payway.api.url=${ABA_PAYWAY_API_URL:https://checkout-sandbox.payway.com.kh}
aba.payway.merchant-id=${ABA_PAYWAY_MERCHANT_ID:YOUR_MERCHANT_ID}
aba.payway.api-key=${ABA_PAYWAY_API_KEY:YOUR_API_KEY}
